repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.14
  hooks:
    # Run the linter.
    - id: ruff-check
      args: ["--fix"]
    # Run the formatter.
    - id: ruff-format

# .pre-commit-config.yaml
- repo: https://github.com/christophmeissner/pytest-pre-commit
  rev: 1.0.0
  hooks:
  - id: pytest
    entry: bash -c 'PYTHONPATH=. pytest'
    language: system
    # pass_filenames: false
    always_run: true  


